---
- name: Configurer le serveur et déployer le portfolio
  hosts: portfolio
  become: true

  vars:
    image: ghcr.io/emb0811/my_portfolio:latest

  tasks:
    - name: Mettre à jour le cache apt
      apt:
        update_cache: true

    - name: Installer les prérequis
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present

    - name: Créer le dossier pour la clé GPG Docker
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Télécharger la clé GPG officielle Docker
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Ajouter le dépôt Docker
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable"
        state: present
        filename: docker

    - name: Installer Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
        state: present
        update_cache: true

    - name: Ajouter ubuntu au groupe docker
      user:
        name: ubuntu
        groups: docker
        append: true

    - name: Télécharger la dernière image depuis GHCR
      command: docker pull {{ image }}

    - name: Créer le dossier de configuration Caddy
      file:
        path: /home/ubuntu/caddy
        state: directory
        mode: "0755"

    - name: Copier la configuration Caddyfile
      copy:
        src: ../caddy/Caddyfile
        dest: /home/ubuntu/caddy/Caddyfile
        mode: "0644"

    - name: Créer le réseau Docker portfolio-net s'il n'existe pas
      command: docker network create portfolio-net
      failed_when: false

    - name: Arrêter l'ancien conteneur portfolio s'il existe
      command: docker rm -f portfolio
      failed_when: false

    - name: Lancer le conteneur portfolio sur le réseau interne
      command: docker run -d --name portfolio --network portfolio-net --restart always --env-file /home/ubuntu/portfolio.env {{ image }}

    - name: Arrêter l'ancien conteneur caddy s'il existe
      command: docker rm -f caddy
      failed_when: false

    - name: Lancer le conteneur Caddy pour HTTPS automatique et reverse proxy
      command: docker run -d --name caddy --network portfolio-net --restart always -p 80:80 -p 443:443 -v /home/ubuntu/caddy/Caddyfile:/etc/caddy/Caddyfile:ro -v caddy_data:/data -v caddy_config:/config caddy:alpine

    - name: Arrêter l'ancien conteneur watchtower s'il existe
      command: docker rm -f watchtower
      failed_when: false

    - name: Lancer Watchtower pour l'auto-déploiement continu
      command: docker run -d --name watchtower --restart always -e DOCKER_API_VERSION=1.44 -v /var/run/docker.sock:/var/run/docker.sock containrrr/watchtower --interval 30 --cleanup portfolio