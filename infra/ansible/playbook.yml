---
- name: Configurer le serveur et déployer le portfolio
  hosts: portfolio
  become: true

  vars:
    image: ghcr.io/emb0811/my_portfolio:latest

  tasks:
    - name: Mettre à jour le cache apt
      apt:
        update_cache: true

    - name: Installer les prérequis
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present

    - name: Créer le dossier pour la clé GPG Docker
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Télécharger la clé GPG officielle Docker
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Ajouter le dépôt Docker
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable"
        state: present
        filename: docker

    - name: Installer Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
        state: present
        update_cache: true

    - name: Ajouter ubuntu au groupe docker
      user:
        name: ubuntu
        groups: docker
        append: true

    - name: Télécharger la dernière image depuis GHCR
      command: docker pull {{ image }}

    - name: Arrêter l'ancien conteneur s'il existe
      command: docker rm -f portfolio
      failed_when: false

    - name: Lancer le nouveau conteneur
      command: docker run -d -p 80:80 --name portfolio --restart always --env-file /home/ubuntu/portfolio.env {{ image }}

    - name: Arrêter l'ancien conteneur watchtower s'il existe
      command: docker rm -f watchtower
      failed_when: false

    - name: Lancer Watchtower pour l'auto-déploiement continu
      command: docker run -d --name watchtower --restart always -e DOCKER_API_VERSION=1.44 -v /var/run/docker.sock:/var/run/docker.sock containrrr/watchtower --interval 30 --cleanup portfolio