---
- name: Installer Prometheus Node Exporter
  hosts: portfolio
  become: true

  vars:
    node_exporter_version: "1.8.2"
    node_exporter_arch: "linux-amd64"

  tasks:

    - name: Créer utilisateur Node Exporter
      ansible.builtin.user:
        name: node_exporter
        system: true
        shell: /usr/sbin/nologin
        create_home: false

    - name: Télécharger Node Exporter
      ansible.builtin.get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.{{ node_exporter_arch }}.tar.gz"
        dest: "/tmp/node_exporter.tar.gz"
        mode: "0644"

    - name: Extraire Node Exporter
      ansible.builtin.unarchive:
        src: "/tmp/node_exporter.tar.gz"
        dest: "/tmp"
        remote_src: true

    - name: Installer le binaire
      ansible.builtin.copy:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.{{ node_exporter_arch }}/node_exporter"
        dest: "/usr/local/bin/node_exporter"
        owner: root
        group: root
        mode: "0755"
        remote_src: true

    - name: Créer service Node Exporter
      ansible.builtin.copy:
        dest: "/etc/systemd/system/node_exporter.service"
        mode: "0644"
        content: |
          [Unit]
          Description=Prometheus Node Exporter
          Wants=network-online.target
          After=network-online.target

          [Service]
          User=node_exporter
          Group=node_exporter
          Type=simple
          ExecStart=/usr/local/bin/node_exporter
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target

    - name: Recharger systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Activer et démarrer Node Exporter
      ansible.builtin.systemd:
        name: node_exporter
        state: started
        enabled: true

    - name: Supprimer archive temporaire
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/tmp/node_exporter.tar.gz"
        - "/tmp/node_exporter-{{ node_exporter_version }}.{{ node_exporter_arch }}"
